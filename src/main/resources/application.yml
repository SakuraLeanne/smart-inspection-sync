spring:
  datasource:
    sqlserver:
      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
      url: jdbc:sqlserver://127.0.0.1:1433;databaseName=PropertyDB;encrypt=false
      username: ${SQLSERVER_USERNAME:sa}
      password: ${SQLSERVER_PASSWORD:change_me}
    mysql:
      driver-class-name: com.mysql.jdbc.Driver
      url: jdbc:mysql://127.0.0.1:3306/portal?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
      username: ${MYSQL_USERNAME:root}
      password: ${MYSQL_PASSWORD:change_me}

sync:
  batch-size:
    customer-service: 3000
    customer-service-history: 5000
  recent-refresh-days:
    customer-service: 90
    customer-service-history: 7
  schedule:
    customer-service-new: "0 0 1 ? * MON"
    customer-service-history-new: "0 20 1 ? * MON"
    customer-service-recent: "0 40 1 ? * MON"
    customer-service-history-recent: "0 0 2 ? * MON"
  sqlserver:
    use-row-number-pagination: false
