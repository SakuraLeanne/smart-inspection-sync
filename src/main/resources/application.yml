    sqlserver:
      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
      jdbc-url: jdbc:sqlserver://10.30.1.11:1433;databaseName=pms_xfzy;encrypt=false
      username: ${SQLSERVER_USERNAME:sa}
      password: ${SQLSERVER_PASSWORD:UwO3V3MDCM}
    mysql:
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: jdbc:mysql://10.30.1.3:3306/apppro?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&connectTimeout=5000&socketTimeout=30000&tcpKeepAlive=true&autoReconnect=true
      username: ${MYSQL_USERNAME:u_app_pro}
      password: ${MYSQL_PASSWORD:BEDiAjvk3Q7d}

sync:
  batch-size:
    customer-service: 3000
    customer-service-history: 5000
  recent-refresh-days:
    customer-service: 90
    customer-service-history: 7
  schedule:
    customer-service-new: "0 0 1 ? * MON"
    customer-service-history-new: "0 20 1 ? * MON"
    customer-service-recent: "0 40 1 ? * MON"
    customer-service-history-recent: "0 0 2 ? * MON"
  sqlserver:
    use-row-number-pagination: false

  full-init:
    enabled: false
    truncate-before-run: false
    fail-fast: false

# 首次全量示例
# java -jar app.jar --sync.full-init.enabled=true
# java -jar app.jar --sync.full-init.enabled=true --sync.full-init.truncate-before-run=true
# 若数据库暂不可达，是否阻断应用启动（默认 false）
