    sqlserver:
      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
      jdbc-url: jdbc:sqlserver://10.30.1.11:1433;databaseName=pms_xfzy;encrypt=false
      username: ${SQLSERVER_USERNAME:sa}
      password: ${SQLSERVER_PASSWORD:UwO3V3MDCM}
    mysql:
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: jdbc:mysql://10.30.1.70:3306/abcadmin_default?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&connectTimeout=10000&socketTimeout=60000&tcpKeepAlive=true&useSSL=true&requireSSL=false&allowPublicKeyRetrieval=true
      username: ${MYSQL_USERNAME:root}
      password: ${MYSQL_PASSWORD:1qazxsw2.}
      # 连接池超时参数（毫秒），用于减少网络抖动导致的误判
      connection-timeout: 30000
      validation-timeout: 5000

sync:
  batch-size:
    customer-service: 3000
    customer-service-history: 5000
    materials-inventory-request: 300
    materials-inventory-request-detail: 500
  recent-refresh-days:
    customer-service: 90
    customer-service-history: 7
  throttle-sleep-ms:
    materials-inventory-request: 100
  schedule:
    customer-service-new: "0 0 1 ? * MON"
    customer-service-history-new: "0 20 1 ? * MON"
    customer-service-recent: "0 40 1 ? * MON"
    customer-service-history-recent: "0 0 2 ? * MON"
  sqlserver:
    use-row-number-pagination: false
  full-init:
    enabled: false
    truncate-before-run: false
    fail-fast: false

# 首次全量示例
# java -jar app.jar --sync.full-init.enabled=true
# java -jar app.jar --sync.full-init.enabled=true --sync.full-init.truncate-before-run=true
# 若数据库暂不可达，是否阻断应用启动（默认 false）
# --sync.full-init.fail-fast=true
